<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 148" width="880" height="148" role="img" aria-label="GitHub statistics">
  <style>
    .ink { fill: #e6edf3; } .dim { fill: #8b949e; } .faint { fill: #6e7681; }
    .s0 { fill: #e6edf3; } .s1 { fill: #c9d1d9; } .s2 { fill: #a8b1ba; }
    .s3 { fill: #8b949e; } .s4 { fill: #6e7681; } .s5 { fill: #484f58; } .s6 { fill: #30363d; }
    .trk { fill: #30363d; } .rule { stroke: #30363d; }
    @media (prefers-color-scheme: light) {
      .ink { fill: #0d1117; } .dim { fill: #57606a; } .faint { fill: #6e7781; }
      .s0 { fill: #0d1117; } .s1 { fill: #30363d; } .s2 { fill: #57606a; }
      .s3 { fill: #6e7781; } .s4 { fill: #8c959f; } .s5 { fill: #afb8c1; } .s6 { fill: #d0d7de; }
      .trk { fill: #d8dee4; } .rule { stroke: #d8dee4; }
    }
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .val { font-size: 30px; font-weight: 800; letter-spacing: -1px; }
    .big { font-size: 40px; font-weight: 800; letter-spacing: -1.5px; }
    .lbl { font-size: 9px; letter-spacing: 2.2px; }
    .cap { font-size: 10px; letter-spacing: 1.4px; }
    .lgd { font-size: 9px; letter-spacing: 0.4px; }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
           animation: gx .9s cubic-bezier(.16,1,.3,1) forwards; }
    .b1 { animation-delay: .07s; } .b2 { animation-delay: .14s; } .b3 { animation-delay: .21s; }
    .b4 { animation-delay: .28s; } .b5 { animation-delay: .35s; } .b6 { animation-delay: .42s; }
    @keyframes gx { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; transform: scaleX(1); } }
  </style>
  <text x="40" y="54" class="sans val ink">8</text>
  <text x="40" y="72" class="mono lbl faint">REPOSITORIES</text>
  <text x="250" y="54" class="sans val ink">735</text>
  <text x="250" y="72" class="mono lbl faint">CONTRIBUTIONS / 12 MO</text>
  <text x="460" y="54" class="sans val ink">38</text>
  <text x="460" y="72" class="mono lbl faint">DAY STREAK</text>
  <text x="670" y="54" class="sans val ink">0</text>
  <text x="670" y="72" class="mono lbl faint">STARS EARNED</text>
  <line x1="40" y1="88" x2="840" y2="88" class="rule" stroke-width="1" />
  <rect x="40.0" y="104" width="178.5" height="8" rx="1" class="s0 bar b0" />
  <rect x="218.5" y="104" width="176.1" height="8" rx="1" class="s1 bar b1" />
  <rect x="394.6" y="104" width="174.3" height="8" rx="1" class="s2 bar b2" />
  <rect x="568.8" y="104" width="158.3" height="8" rx="1" class="s3 bar b3" />
  <rect x="727.1" y="104" width="98.3" height="8" rx="1" class="s4 bar b4" />
  <rect x="825.4" y="104" width="9.3" height="8" rx="1" class="s5 bar b5" />
  <rect x="834.7" y="104" width="5.3" height="8" rx="1" class="s6 bar b6" />
  <rect x="40" y="126" width="7" height="7" rx="1" class="s0" />
  <text x="52" y="133" class="mono lgd dim">Java 22%</text>
  <rect x="113.6" y="126" width="7" height="7" rx="1" class="s1" />
  <text x="125.6" y="133" class="mono lgd dim">JavaScript 22%</text>
  <rect x="219.89999999999998" y="126" width="7" height="7" rx="1" class="s2" />
  <text x="231.89999999999998" y="133" class="mono lgd dim">Python 22%</text>
  <rect x="304.4" y="126" width="7" height="7" rx="1" class="s3" />
