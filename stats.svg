  <text x="670" y="54" class="sans val ink">0</text>
  <text x="670" y="72" class="mono lbl faint">STARS EARNED</text>
  <line x1="40" y1="88" x2="840" y2="88" class="rule" stroke-width="1" />
  <rect x="40.0" y="104" width="258.7" height="8" rx="1" class="s0 bar b0" />
  <rect x="298.7" y="104" width="148.5" height="8" rx="1" class="s1 bar b1" />
  <rect x="447.2" y="104" width="133.9" height="8" rx="1" class="s2 bar b2" />
  <rect x="581.1" y="104" width="132.1" height="8" rx="1" class="s3 bar b3" />
  <rect x="713.2" y="104" width="73.7" height="8" rx="1" class="s4 bar b4" />
  <rect x="786.9" y="104" width="41.3" height="8" rx="1" class="s5 bar b5" />
  <rect x="828.2" y="104" width="11.8" height="8" rx="1" class="s6 bar b6" />
