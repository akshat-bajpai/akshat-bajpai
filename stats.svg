  <rect x="124.5" y="126" width="7" height="7" rx="1" class="s1" />
  <text x="136.5" y="133" class="mono lgd dim">C++ 19%</text>
  <rect x="192.65" y="126" width="7" height="7" rx="1" class="s2" />
  <text x="204.65" y="133" class="mono lgd dim">Java 17%</text>
  <rect x="266.25" y="126" width="7" height="7" rx="1" class="s3" />
