<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 148" width="880" height="148" role="img" aria-label="LeetCode progress">
  <style>
    .ink { fill: #e6edf3; } .dim { fill: #8b949e; } .faint { fill: #6e7681; }
    .s0 { fill: #e6edf3; } .s1 { fill: #c9d1d9; } .s2 { fill: #a8b1ba; }
    .s3 { fill: #8b949e; } .s4 { fill: #6e7681; } .s5 { fill: #484f58; } .s6 { fill: #30363d; }
    .trk { fill: #30363d; } .rule { stroke: #30363d; }
    @media (prefers-color-scheme: light) {
      .ink { fill: #0d1117; } .dim { fill: #57606a; } .faint { fill: #6e7781; }
      .s0 { fill: #0d1117; } .s1 { fill: #30363d; } .s2 { fill: #57606a; }
      .s3 { fill: #6e7781; } .s4 { fill: #8c959f; } .s5 { fill: #afb8c1; } .s6 { fill: #d0d7de; }
      .trk { fill: #d8dee4; } .rule { stroke: #d8dee4; }
    }
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .val { font-size: 30px; font-weight: 800; letter-spacing: -1px; }
    .big { font-size: 40px; font-weight: 800; letter-spacing: -1.5px; }
    .lbl { font-size: 9px; letter-spacing: 2.2px; }
    .cap { font-size: 10px; letter-spacing: 1.4px; }
    .lgd { font-size: 9px; letter-spacing: 0.4px; }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
           animation: gx .9s cubic-bezier(.16,1,.3,1) forwards; }
    .b1 { animation-delay: .07s; } .b2 { animation-delay: .14s; } .b3 { animation-delay: .21s; }
    .b4 { animation-delay: .28s; } .b5 { animation-delay: .35s; } .b6 { animation-delay: .42s; }
    @keyframes gx { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; transform: scaleX(1); } }
  </style>
  <text x="40" y="62" class="sans big ink">427</text>
  <text x="40" y="82" class="mono lbl faint">PROBLEMS SOLVED</text>
  <text x="40" y="112" class="mono cap dim">GLOBAL RANK 282,528</text>
  <line x1="250" y1="24" x2="250" y2="124" class="rule" stroke-width="1" />
  <text x="300" y="40" class="mono cap dim">EASY</text>
  <text x="840" y="40" text-anchor="end" class="mono cap faint">160 / 962</text>
  <rect x="300" y="48" width="540" height="5" rx="2.5" class="trk" />
  <rect x="300" y="48" width="89.8" height="5" rx="2.5" class="s0 bar b1" />
  <text x="300" y="74" class="mono cap dim">MEDIUM</text>
  <text x="840" y="74" text-anchor="end" class="mono cap faint">216 / 2109</text>
  <rect x="300" y="82" width="540" height="5" rx="2.5" class="trk" />
  <rect x="300" y="82" width="55.3" height="5" rx="2.5" class="s2 bar b2" />
  <text x="300" y="108" class="mono cap dim">HARD</text>
  <text x="840" y="108" text-anchor="end" class="mono cap faint">51 / 971</text>
  <rect x="300" y="116" width="540" height="5" rx="2.5" class="trk" />
  <rect x="300" y="116" width="28.4" height="5" rx="2.5" class="s4 bar b3" />
</svg>
