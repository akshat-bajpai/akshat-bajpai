name: profile cards

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#8b949e&color_dots=#161b22,#21262d,#30363d,#484f58,#6e7681
            dist/snake-light.svg?color_snake=#57606a&color_dots=#eaeef2,#d0d7de,#afb8c1,#8c959f,#6e7781

      - name: Generate stats and leetcode cards
        uses: actions/github-script@v7
        env:
          LEETCODE_USER: akspai
        with:
          script: |
            const fs = require('fs');
            const user = context.repo.owner;
            const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'k' : String(n);
            const group = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

            const THEME = [
              '  <style>',
              '    .ink { fill: #e6edf3; } .dim { fill: #8b949e; } .faint { fill: #6e7681; }',
              '    .s0 { fill: #e6edf3; } .s1 { fill: #c9d1d9; } .s2 { fill: #a8b1ba; }',
              '    .s3 { fill: #8b949e; } .s4 { fill: #6e7681; } .s5 { fill: #484f58; } .s6 { fill: #30363d; }',
              '    .trk { fill: #30363d; } .rule { stroke: #30363d; }',
              '    @media (prefers-color-scheme: light) {',
              '      .ink { fill: #0d1117; } .dim { fill: #57606a; } .faint { fill: #6e7781; }',
              '      .s0 { fill: #0d1117; } .s1 { fill: #30363d; } .s2 { fill: #57606a; }',
              '      .s3 { fill: #6e7781; } .s4 { fill: #8c959f; } .s5 { fill: #afb8c1; } .s6 { fill: #d0d7de; }',
              '      .trk { fill: #d8dee4; } .rule { stroke: #d8dee4; }',
              '    }',
              '    .sans { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; }',
              '    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }',
              '    .val { font-size: 30px; font-weight: 800; letter-spacing: -1px; }',
              '    .big { font-size: 40px; font-weight: 800; letter-spacing: -1.5px; }',
              '    .lbl { font-size: 9px; letter-spacing: 2.2px; }',
              '    .cap { font-size: 10px; letter-spacing: 1.4px; }',
              '    .lgd { font-size: 9px; letter-spacing: 0.4px; }',
              '    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);',
              '           animation: gx .9s cubic-bezier(.16,1,.3,1) forwards; }',
              '    .b1 { animation-delay: .07s; } .b2 { animation-delay: .14s; } .b3 { animation-delay: .21s; }',
              '    .b4 { animation-delay: .28s; } .b5 { animation-delay: .35s; } .b6 { animation-delay: .42s; }',
              '    @keyframes gx { to { transform: scaleX(1); } }',
              '    @media (prefers-reduced-motion: reduce) { .bar { animation: none; transform: scaleX(1); } }',
              '  </style>'
            ];

            let repos = [];
            try {
              repos = await github.paginate(github.rest.repos.listForUser, { username: user, per_page: 100, type: 'owner' });
            } catch (e) { core.warning('repos: ' + e.message); }
            const owned = repos.filter(r => !r.fork && !r.private);
            const stars = repos.reduce((a, r) => a + (r.stargazers_count || 0), 0);

            const bytes = {};
            for (const r of owned) {
              try {
                const res = await github.rest.repos.listLanguages({ owner: user, repo: r.name });
                for (const k of Object.keys(res.data)) bytes[k] = (bytes[k] || 0) + res.data[k];
              } catch (e) { /* skip */ }
            }
            const totalBytes = Object.values(bytes).reduce((a, b) => a + b, 0) || 1;
            const langs = Object.entries(bytes).sort((a, b) => b[1] - a[1]).slice(0, 6)
              .map(e => ({ name: e[0], pct: e[1] / totalBytes }));
            const covered = langs.reduce((a, l) => a + l.pct, 0);
            if (covered < 0.995) langs.push({ name: 'other', pct: 1 - covered });

            let contributions = null, streak = null;
            try {
              const q = await github.graphql(
                'query($u:String!){ user(login:$u){ contributionsCollection{ contributionCalendar{ totalContributions weeks{ contributionDays{ date contributionCount } } } } } }',
                { u: user });
              const cal = q.user.contributionsCollection.contributionCalendar;
              contributions = cal.totalContributions;
              const days = cal.weeks.flatMap(w => w.contributionDays).sort((a, b) => a.date < b.date ? -1 : 1);
              let i = days.length - 1;
              if (i >= 0 && days[i].contributionCount === 0) i--;
              let s = 0;
              while (i >= 0 && days[i].contributionCount > 0) { s++; i--; }
              streak = s;
            } catch (e) { core.warning('contributions: ' + e.message); }

            const figures = [
              [fmt(owned.length), 'REPOSITORIES'],
              [contributions === null ? '-' : fmt(contributions), 'CONTRIBUTIONS / 12 MO'],
              [streak === null ? '-' : fmt(streak), 'DAY STREAK'],
              [fmt(stars), 'STARS EARNED']
            ];

            const sBody = [];
            figures.forEach((f, i) => {
              const fx = 40 + i * 210;
              sBody.push('  <text x="' + fx + '" y="54" class="sans val ink">' + esc(f[0]) + '</text>');
              sBody.push('  <text x="' + fx + '" y="72" class="mono lbl faint">' + esc(f[1]) + '</text>');
            });
            sBody.push('  <line x1="40" y1="88" x2="840" y2="88" class="rule" stroke-width="1" />');
            let bx = 40;
            langs.forEach((l, i) => {
              const w = Math.max(2, l.pct * 800);
              sBody.push('  <rect x="' + bx.toFixed(1) + '" y="104" width="' + w.toFixed(1) + '" height="8" rx="1" class="s' + i + ' bar b' + i + '" />');
              bx += w;
            });
            let lx = 40;
            langs.forEach((l, i) => {
              const label = l.name + ' ' + Math.round(l.pct * 100) + '%';
              sBody.push('  <rect x="' + lx + '" y="126" width="7" height="7" rx="1" class="s' + i + '" />');
              sBody.push('  <text x="' + (lx + 12) + '" y="133" class="mono lgd dim">' + esc(label) + '</text>');
              lx += 12 + label.length * 5.45 + 18;
            });

            const statsSvg = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 148" width="880" height="148" role="img" aria-label="GitHub statistics">']
              .concat(THEME).concat(sBody).concat(['</svg>', '']).join('\n');

            fs.mkdirSync('out', { recursive: true });
            fs.writeFileSync('out/stats.svg', statsSvg);
            core.info('stats.svg ' + statsSvg.length + ' bytes');

            const lcUser = process.env.LEETCODE_USER;
            try {
              const query = 'query($u:String!){ matchedUser(username:$u){ profile{ ranking } submitStatsGlobal{ acSubmissionNum{ difficulty count } } } allQuestionsCount{ difficulty count } }';
              const res = await fetch('https://leetcode.com/graphql', {
                method: 'POST',
                headers: { 'content-type': 'application/json', 'referer': 'https://leetcode.com/u/' + lcUser + '/', 'user-agent': 'Mozilla/5.0' },
                body: JSON.stringify({ query, variables: { u: lcUser } })
              });
              const j = await res.json();
              if (!j.data || !j.data.matchedUser) throw new Error('no matchedUser');
              const ac = {}, tot = {};
              j.data.matchedUser.submitStatsGlobal.acSubmissionNum.forEach(d => { ac[d.difficulty] = d.count; });
              j.data.allQuestionsCount.forEach(d => { tot[d.difficulty] = d.count; });
              const rank = j.data.matchedUser.profile.ranking;

              const lBody = [];
              lBody.push('  <text x="40" y="62" class="sans big ink">' + esc(String(ac.All || 0)) + '</text>');
              lBody.push('  <text x="40" y="82" class="mono lbl faint">PROBLEMS SOLVED</text>');
              if (rank) lBody.push('  <text x="40" y="112" class="mono cap dim">GLOBAL RANK ' + esc(group(rank)) + '</text>');
              lBody.push('  <line x1="250" y1="24" x2="250" y2="124" class="rule" stroke-width="1" />');
              ['Easy', 'Medium', 'Hard'].forEach((d, i) => {
                const y = 40 + i * 34;
                const solved = ac[d] || 0, all = tot[d] || 1;
                const w = Math.max(2, (solved / all) * 540);
                lBody.push('  <text x="300" y="' + y + '" class="mono cap dim">' + d.toUpperCase() + '</text>');
                lBody.push('  <text x="840" y="' + y + '" text-anchor="end" class="mono cap faint">' + solved + ' / ' + all + '</text>');
                lBody.push('  <rect x="300" y="' + (y + 8) + '" width="540" height="5" rx="2.5" class="trk" />');
                lBody.push('  <rect x="300" y="' + (y + 8) + '" width="' + w.toFixed(1) + '" height="5" rx="2.5" class="s' + (i * 2) + ' bar b' + (i + 1) + '" />');
              });
              const lcSvg = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 148" width="880" height="148" role="img" aria-label="LeetCode progress">']
                .concat(THEME).concat(lBody).concat(['</svg>', '']).join('\n');
              fs.writeFileSync('out/leetcode.svg', lcSvg);
              core.info('leetcode.svg ' + lcSvg.length + ' bytes');
            } catch (e) {
              core.warning('leetcode: ' + e.message);
            }

      - name: Collect snake output
        run: sudo cp -r dist/. out/ && sudo chown -R $(id -u):$(id -g) out

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
