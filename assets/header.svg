<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Akshat Bajpai — backend and platform engineering, IIIT Delhi">
<title>Akshat Bajpai</title>
<defs>
<linearGradient id="sh"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="tm"><rect width="880" height="250" fill="#000"/><text x="440" y="148" text-anchor="middle" class="sans wm" fill="#fff">AKSHAT BAJPAI</text></mask>
<mask id="rv"><rect class="rvr" x="80" y="96" width="720" height="70" fill="#fff"/></mask>
</defs>
<style>
.ink{fill:#e6edf3}.dim{fill:#8b949e}.faint{fill:#6e7681}.rulef{fill:#30363d}
@media (prefers-color-scheme:light){.ink{fill:#0d1117}.dim{fill:#57606a}.faint{fill:#6e7781}.rulef{fill:#d0d7de}}
.sans{font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace}
.wm{font-size:66px;font-weight:800;letter-spacing:-1.5px}
.eb{font-size:10px;letter-spacing:5px}
.st{font-size:11.5px;letter-spacing:1.2px}
.rvr{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:ex 1.1s cubic-bezier(.16,1,.3,1) forwards .15s}
.rl{transform-box:fill-box;transform-origin:center;transform:scaleX(0);animation:ex 1s cubic-bezier(.16,1,.3,1) forwards .8s}
@keyframes ex{to{transform:scaleX(1)}}
.fade{opacity:0;animation:fi .9s ease forwards}
.f1{animation-delay:.05s}.f2{animation-delay:1s}
@keyframes fi{to{opacity:1}}
.sheen{animation:sw 6.5s cubic-bezier(.5,0,.5,1) infinite 2s}
@keyframes sw{0%{transform:translateX(0)}55%,100%{transform:translateX(1200px)}}
@media (prefers-reduced-motion:reduce){
.rvr,.rl,.fade,.sheen{animation:none}.rvr,.rl{transform:scaleX(1)}.fade{opacity:1}.sheen{opacity:0}}
</style>
<text x="440" y="72" text-anchor="middle" class="mono eb faint fade f1">BACKEND &#183; PLATFORM &#183; SYSTEMS</text>
<g mask="url(#rv)"><text x="440" y="148" text-anchor="middle" class="sans wm ink">AKSHAT BAJPAI</text></g>
<g mask="url(#tm)"><rect class="sheen" x="-300" y="90" width="300" height="80" fill="url(#sh)"/></g>
<rect class="rulef rl" x="190" y="176" width="500" height="1"/>
<text x="440" y="206" text-anchor="middle" class="mono st dim fade f2">IIIT Delhi &#8217;28 &#183; matching engines, inference services, event pipelines</text>
</svg>
