<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="Akshat Bajpai — Computer Science and Economics, IIIT Delhi">
  <title>Akshat Bajpai</title>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" class="f-faint" />
    </pattern>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8b949e" stop-opacity="0" />
      <stop offset="50%"  stop-color="#8b949e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8b949e" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="fadeEdges" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0" />
      <stop offset="8%"   stop-color="#fff" stop-opacity="1" />
      <stop offset="92%"  stop-color="#fff" stop-opacity="1" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </linearGradient>

    <mask id="edgeMask">
      <rect x="0" y="0" width="880" height="260" fill="url(#fadeEdges)" />
    </mask>

    <mask id="reveal">
      <rect class="revealer" x="40" y="78" width="700" height="60" fill="#fff" />
    </mask>

    <path id="ecg"
      d="M -20 214
         h72 l12,-7 l12,7 h14 l8,7 l9,-46 l9,58 l8,-19 h10 l14,-11 l14,11 h28
         h72 l12,-7 l12,7 h14 l8,7 l9,-46 l9,58 l8,-19 h10 l14,-11 l14,11 h28
         h72 l12,-7 l12,7 h14 l8,7 l9,-46 l9,58 l8,-19 h10 l14,-11 l14,11 h28
         h72 l12,-7 l12,7 h14 l8,7 l9,-46 l9,58 l8,-19 h10 l14,-11 l14,11 h40"
      pathLength="1000" fill="none" />
  </defs>

  <style>
    .f-ink   { fill: #e6edf3; }
    .f-dim   { fill: #8b949e; }
    .f-faint { fill: #484f58; }
    .s-ink   { stroke: #e6edf3; }
    .s-dim   { stroke: #6e7681; }
    .s-faint { stroke: #30363d; }

    @media (prefers-color-scheme: light) {
      .f-ink   { fill: #0d1117; }
      .f-dim   { fill: #57606a; }
      .f-faint { fill: #afb8c1; }
      .s-ink   { stroke: #0d1117; }
      .s-dim   { stroke: #6e7781; }
      .s-faint { stroke: #d8dee4; }
    }

    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

    .eyebrow  { font-size: 11px; letter-spacing: 4.5px; }
    .name     { font-size: 46px; font-weight: 700; letter-spacing: 7px; }
    .subtitle { font-size: 13px; letter-spacing: 2.6px; }
    .rotator  { font-size: 12.5px; letter-spacing: 1.6px; }
    .meter    { font-size: 10px; letter-spacing: 3px; }

    .revealer {
      transform-box: fill-box;
      transform-origin: left center;
      animation: reveal 1.25s cubic-bezier(.16,1,.3,1) forwards;
    }
    @keyframes reveal { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .cursor { animation: blink 1.15s steps(1) infinite 1.3s; }
    @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }

    .fade-1 { opacity: 0; animation: fade .8s ease forwards 1.15s; }
    .fade-2 { opacity: 0; animation: fade .8s ease forwards 1.45s; }
    .fade-3 { opacity: 0; animation: fade .8s ease forwards 1.7s; }
    @keyframes fade { to { opacity: 1; } }

    .trace {
      stroke-dasharray: 90 1000;
      animation: trace 5.5s linear infinite 1.6s;
    }
    @keyframes trace { from { stroke-dashoffset: 1090; } to { stroke-dashoffset: 0; } }

    .lead { opacity: 0; animation: lead 5.5s linear infinite 1.6s; }
    @keyframes lead { 0% { opacity: 0; } 4% { opacity: 1; } 96% { opacity: 1; } 100% { opacity: 0; } }

    .bar { animation: swing 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    .bar-2 { animation-delay: -1.1s; }
    .bar-3 { animation-delay: -2.4s; }
    .bar-4 { animation-delay: -3.6s; }
    @keyframes swing { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

    .rot { opacity: 0; }
    .r1 { animation: rot 13.5s ease-in-out infinite 1.9s; }
    .r2 { animation: rot 13.5s ease-in-out infinite 6.4s; }
    .r3 { animation: rot 13.5s ease-in-out infinite 10.9s; }
    @keyframes rot { 0%,1% { opacity: 0; } 5%,26% { opacity: 1; } 31%,100% { opacity: 0; } }

    .rule-sweep { animation: slide 6.5s linear infinite; }
    @keyframes slide { from { transform: translateX(-220px); } to { transform: translateX(880px); } }

    @media (prefers-reduced-motion: reduce) {
      .revealer, .cursor, .fade-1, .fade-2, .fade-3,
      .trace, .lead, .bar, .rot, .rule-sweep { animation: none; }
      .revealer { transform: none; }
      .fade-1, .fade-2, .fade-3, .rot, .lead { opacity: 1; }
      .trace { stroke-dasharray: none; }
    }
  </style>

  <g mask="url(#edgeMask)">
    <rect x="0" y="0" width="880" height="260" fill="url(#grid)" opacity=".5" />
  </g>

  <!-- top hairline + travelling highlight -->
  <line x1="40" y1="26" x2="840" y2="26" class="s-faint" stroke-width="1" />
  <g mask="url(#edgeMask)">
    <rect class="rule-sweep" x="0" y="25" width="200" height="1.4" fill="url(#sweep)" />
  </g>

  <!-- eyebrow -->
  <text x="40" y="58" class="mono eyebrow f-dim fade-1">GITHUB.COM/AKSHAT-BAJPAI</text>
  <text x="840" y="58" class="mono eyebrow f-faint fade-1" text-anchor="end">NEW DELHI · IN</text>

  <!-- name -->
  <g mask="url(#reveal)">
    <text x="40" y="120" class="mono name f-ink">AKSHAT BAJPAI<tspan class="f-dim cursor" dx="6">_</tspan></text>
  </g>

  <!-- subtitle -->
  <text x="42" y="150" class="mono subtitle f-dim fade-2">COMPUTER SCIENCE &#215; ECONOMICS &#183; IIIT DELHI &#183; &#39;28</text>

  <!-- rotating status line -->
  <g class="fade-3">
    <text x="42" y="180" class="mono rotator f-faint rot r1">&#8250;&#8250; building systems that stay correct under concurrency</text>
    <text x="42" y="180" class="mono rotator f-faint rot r2">&#8250;&#8250; matching engines &#183; clinical decision support &#183; developer tooling</text>
    <text x="42" y="180" class="mono rotator f-faint rot r3">&#8250;&#8250; codeforces: akspai &#183; still solving one a day</text>
  </g>

  <!-- signature: live monitor trace -->
  <g mask="url(#edgeMask)">
    <use href="#ecg" xlink:href="#ecg" class="s-faint" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <use href="#ecg" xlink:href="#ecg" class="s-ink trace" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <circle r="2.6" class="f-ink lead">
      <animateMotion dur="5.5s" repeatCount="indefinite" begin="1.6s" rotate="auto">
        <mpath href="#ecg" xlink:href="#ecg" />
      </animateMotion>
    </circle>
  </g>

  <!-- readout meter -->
  <g class="fade-3">
    <rect class="f-dim bar"   x="778" y="196" width="3" height="22" />
    <rect class="f-dim bar bar-2" x="786" y="196" width="3" height="22" />
    <rect class="f-dim bar bar-3" x="794" y="196" width="3" height="22" />
    <rect class="f-dim bar bar-4" x="802" y="196" width="3" height="22" />
    <text x="840" y="217" class="mono meter f-faint" text-anchor="end">LIVE</text>
  </g>

  <!-- bottom hairline -->
  <line x1="40" y1="240" x2="840" y2="240" class="s-faint" stroke-width="1" />
</svg>
